<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>プレイ人口突破カード（写真）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" />
<style>
  /* The milestone card, lab-notebook version: four real in-game scenes (scenes/*.png, capture-scenes.mjs) taped on
     graph paper, with the game's red rank-in stamp on top. Palette = game/src/ui/tokens.css. */
  :root {
    --paper-1: #f3eee4; --paper-2: #e6dccb; --ink: #1e2a44; --ink-2: #4b5670; --ball: #e0312b;
    --stamp: #d8342b; --card: #fbf8f1; --note: #fff3c4; --tape: rgba(233, 222, 196, 0.82);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "M PLUS Rounded 1c", sans-serif; color: var(--ink); position: relative;
    background:
      linear-gradient(rgba(201,194,182,.55) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, rgba(201,194,182,.55) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(rgba(201,194,182,.24) 1px, transparent 1px) 0 0 / 16px 16px,
      linear-gradient(90deg, rgba(201,194,182,.24) 1px, transparent 1px) 0 0 / 16px 16px,
      var(--paper-1);
  }

  /* Photos: a white print border, a caption strip, a shadow, and a piece of tape. */
  .photo { position: absolute; width: 624px; padding: 12px 12px 0; background: var(--card);
    box-shadow: 0 2px 0 rgba(30,42,68,.10), 0 14px 26px rgba(30,42,68,.18); }
  .photo .img { width: 600px; height: 338px; overflow: hidden; }
  /* Zoomed on the walls and the ball (the scene sits a little right of centre at x ≈ 60 %). */
  .photo img { display: block; width: 600px; height: 338px; object-fit: cover; transform: scale(1.22); transform-origin: 62% 58%; }
  .photo figcaption { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 6px;
    font: 800 20px/1 "M PLUS Rounded 1c"; color: var(--ink-2); letter-spacing: .04em; }
  .photo figcaption b { color: var(--ink); font-size: 22px; }
  .photo::before { content: ""; position: absolute; top: -16px; left: 50%; width: 150px; height: 34px;
    margin-left: -75px; background: var(--tape); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .p1 { left: 44px;  top: 34px;  transform: rotate(-2.4deg); }
  .p2 { left: 932px; top: 28px;  transform: rotate(1.8deg); }
  .p3 { left: 58px;  top: 478px; transform: rotate(1.4deg); }
  .p4 { left: 922px; top: 484px; transform: rotate(-1.7deg); }
  .p2::before { transform: rotate(4deg); } .p3::before { transform: rotate(2deg); }
  /* The right-hand captions sit at the outer edge, clear of the stamp. */
  .p2 figcaption, .p4 figcaption { justify-content: flex-end; }

  /* The stamp: the rank-in stamp's double ring (game .stamp--rank), scaled up. */
  .stamp { position: absolute; left: 50%; top: 47%; width: max-content;
    padding: 22px 44px 24px; white-space: nowrap; border-radius: 34px; text-align: center; color: var(--stamp);
    border: 11px solid var(--stamp); background: rgba(251, 248, 241, .94);
    box-shadow: inset 0 0 0 7px var(--card), inset 0 0 0 12px var(--stamp), 0 18px 34px rgba(30,42,68,.22);
    transform: translate(-50%, -50%) rotate(-6deg); }
  .logo { display: inline-flex; align-items: baseline; font: 800 36px/1 "M PLUS Rounded 1c"; color: var(--ink); }
  .logo b { color: var(--ball); display: inline-block; transform: rotate(-4deg); margin-left: .04em; }
  .lead { margin-top: 12px; font: 800 40px/1 "M PLUS Rounded 1c"; letter-spacing: .12em; }
  .big { margin-top: 4px; display: flex; flex-wrap: nowrap; align-items: baseline; justify-content: center; gap: 6px; }
  .num { font: 800 132px/1 "M PLUS Rounded 1c"; letter-spacing: -.03em; }
  .unit { font: 800 60px/1 "M PLUS Rounded 1c"; }
  .toppa { font: 800 52px/1 "M PLUS Rounded 1c"; margin-left: 6px; }
  .thanks { margin-top: 14px; font: 800 32px/1 "M PLUS Rounded 1c"; color: var(--ink); letter-spacing: .04em; }
  .thanks em { font-style: normal; color: var(--ball); }

  /* The sticky note: the open challenge. */
  /* Bottom centre, between the lower photos: only floor and ruler there, never a ball. */
  .note { position: absolute; left: 50%; bottom: 22px; width: max-content; padding: 16px 26px 14px; background: var(--note);
    box-shadow: 0 10px 18px rgba(30,42,68,.2); transform: translateX(-50%) rotate(2.5deg); font: 800 30px/1.3 "M PLUS Rounded 1c";
    text-align: center; }
  .note small { display: block; margin-top: 4px; font: 800 22px/1.3 "M PLUS Rounded 1c"; color: var(--ink-2); }
  .note b { color: var(--stamp); font-size: 42px; }
  .note[hidden] { display: none; }
</style>
</head>
<body>
  <figure class="photo p1"><div class="img"><img src="scenes/classic.png" alt="" /></div><figcaption><b>原典</b>赤いボール・黄色いガントリー</figcaption></figure>
  <figure class="photo p2"><div class="img"><img src="scenes/tancho.png" alt="" /></div><figcaption><b>丹頂</b>瑠璃玉・丹頂仕立て・鶴の城</figcaption></figure>
  <figure class="photo p3"><div class="img"><img src="scenes/wood.png" alt="" /></div><figcaption><b>研究室</b>鋼球・手作り実験装置</figcaption></figure>
  <figure class="photo p4"><div class="img"><img src="scenes/primer.png" alt="" /></div><figcaption><b>工事現場</b>解体鉄球・錆止めと紅白</figcaption></figure>

  <div class="stamp">
    <div class="logo">ゆらして<b>ピタッ</b></div>
    <div class="lead">プレイ人口</div>
    <div class="big"><span class="num" id="n">4,000</span><span class="unit">人</span><span class="toppa">突破！</span></div>
    <div class="thanks">遊んでくれて<em>ありがとう！</em></div>
  </div>

  <div class="note" id="note" hidden>全18面クリアは、まだ <b id="clear">2</b> 人。<small>あなたも挑戦してみて！</small></div>
<script>
  // ?n=4000 -> 「4,000人」; ?clear=2 shows the sticky note (omitted: no note).
  const q = new URLSearchParams(location.search);
  const n = Number(q.get('n') || 4000);
  document.getElementById('n').textContent = n.toLocaleString('ja-JP');
  document.title = `プレイ人口${n}人突破`;
  if (q.has('clear')) {
    document.getElementById('clear').textContent = String(Number(q.get('clear')));
    document.getElementById('note').hidden = false;
  }
</script>
</body>
</html>
