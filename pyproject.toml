[project]
name = "crane-ball-wall"
version = "1.0.0"
description = "Gantry crane with a ball on a string: swing it into the gap between two walls and back out (trajectory optimisation + TVLQR)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kaibuchi Soma" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "casadi>=3.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
