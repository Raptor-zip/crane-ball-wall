<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Render demo — ゆらしてピタッ</title>
    <style>
      :root {
        --paper-1: #f3eee4; --paper-2: #e6dccb; --ink: #1e2a44; --danger: #e5484d; --ai: #19c3ff; --goal: #22b573;
        --font-num: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper-1); color: var(--ink); font-family: var(--font-body); }
      #demo { position: fixed; inset: 0; }
      canvas.scene { position: absolute; display: block; touch-action: none; }
      /* Mock HUD band (the real HUD is O7's DOM overlay). */
      #hud { position: fixed; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 10px; box-sizing: border-box; pointer-events: none; }
      #hud .btn { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.72); display: grid; place-items: center;
        font-size: 22px; font-weight: 800; box-shadow: 0 1px 0 rgba(30, 42, 68, 0.18); }
      #hud .mid { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
      #title { font-size: 13px; font-weight: 700; opacity: 0.75; }
      #clock { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; }
      /* Mock HUD panel under the band (tall: status row + scoreboard down to hudTop; O7's DOM in the game). */
      #hudpanel { position: fixed; left: 12px; right: 12px; top: 56px; display: none; box-sizing: border-box; pointer-events: none;
        border-radius: 14px; background: rgba(255, 255, 255, 0.55); border: 1px dashed rgba(30, 42, 68, 0.22);
        font-size: 11px; color: rgba(30, 42, 68, 0.55); padding: 6px 10px; }
      body[data-layout='tall'] #hudpanel { display: block; }
      /* Mock deck for the tall layout. */
      #deck { position: fixed; left: 0; right: 0; background: #ebe3d4; border-top: 1px solid rgba(30, 42, 68, 0.15); display: none; }
      #deck .bar { height: 8px; background: rgba(30, 42, 68, 0.12); position: relative; }
      #deck .rail { height: 72px; border-bottom: 1px dashed rgba(30, 42, 68, 0.2); }
      #deck .fine { position: absolute; left: 0; right: 0; bottom: 0; height: 33%; background: rgba(30, 42, 68, 0.05); }
      #deck .fine span { position: absolute; right: 10px; top: 6px; font-size: 12px; opacity: 0.5; font-family: var(--font-num); }
      #forcebar { position: fixed; left: 50%; bottom: 14px; width: 260px; margin-left: -130px; height: 8px; border-radius: 4px;
        background: rgba(30, 42, 68, 0.12); overflow: hidden; }
      body[data-layout='tall'] #forcebar { display: none; }
      #fbfill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--ink); }
      #panel { position: fixed; right: 8px; top: 64px; background: rgba(255, 255, 255, 0.9); border-radius: 12px; padding: 8px; font-size: 12px;
        box-shadow: 0 2px 12px rgba(30, 42, 68, 0.15); max-width: 230px; }
      #panel button { margin: 2px; font: inherit; border: 1px solid rgba(30, 42, 68, 0.25); background: #fff; border-radius: 8px; padding: 3px 7px; }
      #panel select { font: inherit; max-width: 210px; }
      /* Mock popups (stand-ins for O7's DOM popups, placed with renderer.worldToScreen). */
      #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .mock-pop { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
        font-weight: 800; line-height: 1.15; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 6px #fff; }
      .mock-pop b { display: block; font-family: var(--font-num); font-size: 15px; }
      .mock-pop i { display: inline-block; font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 9px;
        box-shadow: 0 1px 0 rgba(30, 42, 68, 0.25); text-shadow: none; margin-top: 2px; }
      .mock-pop.bang { font-size: 22px; color: var(--danger); letter-spacing: 1px; }
      .mock-pop.crashinfo b { color: var(--danger); }
      .mock-pop.crashinfo i { background: #fff; }
    </style>
  </head>
  <body>
    <div id="demo"></div>
    <div id="pops"></div>
    <div id="hud">
      <div class="btn">↺</div>
      <div class="mid"><span id="title">-</span><span id="clock">0.00</span></div>
      <div class="btn">⏸</div>
    </div>
    <div id="hudpanel">HUD (O7): status row, AI / PB scoreboard</div>
    <div id="deck">
      <div class="bar"><div id="deckForce"></div></div>
      <div class="rail"></div>
      <div class="fine"><span>×1/3</span></div>
    </div>
    <div id="forcebar"><div id="fbfill"></div></div>
    <div id="panel">
      <div><select id="levelSel"></select></div>
      <div id="fxButtons"></div>
      <label><input type="checkbox" id="aiLine" checked /> AI line</label>
      <label><input type="checkbox" id="margin" checked /> 2 cm</label>
      <div><span id="mapped"></span></div>
    </div>
    <script type="module" src="./render-demo.ts"></script>
  </body>
</html>
